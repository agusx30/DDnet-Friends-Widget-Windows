[package]
name = "ddnet-friends"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tao = "0.30"
tray-icon = "0.19"
notify-rust = "4"
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
